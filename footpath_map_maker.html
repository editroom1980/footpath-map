<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フットパスマップメーカー</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Hiragino Sans','Meiryo',sans-serif;font-size:13px;color:#2C1B0E}

/* ====== LAYOUT ====== */
#app{display:flex;flex-direction:column;height:100vh}

#hdr{
  background:#3E2A0E;color:#F5EDD8;height:46px;
  display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;
}
#hdr h1{font-size:14px;white-space:nowrap}
#cnDisp{font-size:11px;opacity:.65;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#tbar{
  background:#F5EDD8;border-bottom:1px solid #D4C4A8;
  padding:5px 10px;display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;
}
#status{font-size:11px;color:#777;margin-left:6px}

#body{display:flex;flex:1;overflow:hidden}

/* ====== SIDEBAR ====== */
#sidebar{
  width:250px;flex-shrink:0;background:#FAF6EE;
  border-right:1px solid #D4C4A8;display:flex;flex-direction:column;overflow:hidden;
}
.sec{border-bottom:1px solid #D4C4A8}
.sec-hdr{
  padding:8px 12px;font-size:11px;font-weight:bold;color:#4A2E0E;background:#F0E8D8;
  cursor:pointer;display:flex;justify-content:space-between;user-select:none;
}
.sec-body{padding:10px 12px}
.sec-body label{display:block;font-size:10px;color:#666;font-weight:bold;margin-bottom:2px}
.sec-body input,.sec-body select,.sec-body textarea{
  width:100%;padding:4px 7px;border:1px solid #D4C4A8;border-radius:3px;
  font-size:11px;font-family:inherit;background:#fff;outline:none;margin-bottom:6px;
}
.sec-body textarea{resize:vertical;min-height:52px}

#wpSec{flex:1;overflow:hidden;display:flex;flex-direction:column}
#wpList{flex:1;overflow-y:auto;padding:0 12px}
.wp-row{
  display:flex;align-items:center;gap:6px;
  padding:4px 0;border-bottom:1px solid #EEE8DE;cursor:pointer;
}
.wp-row:hover{background:#F0E8D8;margin:0 -12px;padding:4px 12px}
.wp-dot{width:20px;height:20px;border-radius:50%;color:#fff;font-size:9px;font-weight:bold;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wp-label{font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wp-edit-btn{font-size:11px;color:#C4703A;flex-shrink:0}

/* ====== MAP ====== */
#mapWrap{flex:1;position:relative}
#map{width:100%;height:100%}
#mapMsg{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(255,255,255,.88);border:1px solid #D4C4A8;border-radius:6px;
  padding:10px 18px;font-size:11px;text-align:center;z-index:500;pointer-events:none;line-height:1.7;
}

/* ====== BUTTONS ====== */
.btn{
  padding:5px 10px;border:1px solid #C4B89A;border-radius:4px;background:#fff;
  cursor:pointer;font-size:11px;font-family:inherit;white-space:nowrap;line-height:1.4;
}
.btn:hover{background:#F5EDD8}
.btn.on{background:#C4703A;color:#fff;border-color:#C4703A}
.btn-dk{background:#3E2A0E;color:#F5EDD8;border-color:#3E2A0E}
.btn-dk:hover{background:#5C3E1A}
.btn-rd{background:#B71C1C;color:#fff;border-color:#B71C1C}

/* ====== MODAL ====== */
#mOver{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.45);z-index:3000;align-items:center;justify-content:center;
}
#mOver.show{display:flex}
#mBox{
  background:#fff;border-radius:8px;width:min(380px,95vw);max-height:85vh;
  overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.35);
}
#mHdr{
  background:#3E2A0E;color:#F5EDD8;padding:11px 14px;
  border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center;
  font-size:13px;font-weight:bold;
}
#mBody{padding:14px}
#mBody label{display:block;font-size:10px;font-weight:bold;color:#555;margin-bottom:2px}
#mBody input,#mBody select,#mBody textarea{
  width:100%;padding:5px 8px;border:1px solid #D4C4A8;border-radius:4px;
  font-size:12px;font-family:inherit;background:#fff;outline:none;margin-bottom:10px;
}
#mBody textarea{resize:vertical;min-height:56px}
#mFtr{
  padding:10px 14px;border-top:1px solid #EEE;
  display:flex;justify-content:space-between;align-items:center;
}

/* ====== RESULT PANEL ====== */
#resPanel{
  display:none;position:fixed;top:46px;right:0;bottom:0;width:380px;
  background:#fff;border-left:1px solid #D4C4A8;z-index:2000;
  overflow-y:auto;padding:14px;box-shadow:-4px 0 16px rgba(0,0,0,.1);
}
#resPanel.show{display:block}
.res-blk{background:#F8F4EC;border:1px solid #D4C4A8;border-radius:5px;padding:10px;margin-bottom:10px}
.res-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.res-lbl{font-size:10px;font-weight:bold;color:#555;text-transform:uppercase;letter-spacing:.06em}
.res-hint{font-size:9px;color:#999;margin-bottom:6px}
.res-txt{font-size:10px;line-height:1.7;font-family:monospace;white-space:pre-wrap;word-break:break-all}
.cp-btn{padding:2px 8px;background:#4A7A5C;color:#fff;border:none;border-radius:3px;font-size:9px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="hdr">
    <span style="font-size:18px">🗾</span>
    <h1>フットパスマップメーカー</h1>
    <div id="cnDisp"></div>
    <button class="btn btn-dk" onclick="openGen()" style="flex-shrink:0">✨ プロンプト生成</button>
  </div>

  <!-- Toolbar -->
  <div id="tbar">
    <span style="font-size:10px;color:#666">モード:</span>
    <button class="btn on" id="btnWp"  onclick="setMode('wp')">📍 ウェイポイント追加</button>
    <button class="btn"    id="btnVia" onclick="setMode('via')">↔ 経路調整点追加</button>
    <span style="color:#D4C4A8">|</span>
    <button class="btn" onclick="undoLast()">↩ 取り消し</button>
    <button class="btn" onclick="clearAll()">🗑 全消去</button>
    <span id="status">地図をクリックしてウェイポイントを追加</span>
  </div>

  <div id="body">

    <!-- Sidebar -->
    <div id="sidebar">

      <!-- Course info -->
      <div class="sec">
        <div class="sec-hdr" onclick="toggleSec('cBody','cArr')">📋 コース情報 <span id="cArr">▼</span></div>
        <div class="sec-body" id="cBody">
          <label>コース名</label>
          <input id="iName" placeholder="例：飯見の棚田おにぎりウォーク" oninput="syncCourse()">
          <label>エリア・地域</label>
          <input id="iArea" placeholder="例：宍粟市波賀町飯見地区" oninput="syncCourse()">
          <label>見どころ・説明</label>
          <textarea id="iDesc" placeholder="コースの特徴・見どころ..." oninput="syncCourse()"></textarea>
          <label>総距離（km）</label>
          <input id="iDist" placeholder="例：6.5" style="margin-bottom:0" oninput="syncCourse()">
        </div>
      </div>

      <!-- Waypoint list -->
      <div class="sec" id="wpSec">
        <div class="sec-hdr" onclick="toggleSec('wpList','wArr')">📍 ウェイポイント一覧 <span id="wArr">▼</span></div>
        <div id="wpList" style="padding:4px 12px;overflow-y:auto;flex:1">
          <div id="wpEmpty" style="font-size:10px;color:#aaa;text-align:center;padding:16px">まだ追加されていません</div>
        </div>
      </div>

      <!-- API Key -->
      <div class="sec">
        <div class="sec-hdr" onclick="toggleSec('aBody','aArr')">🔑 API設定 <span id="aArr">▶</span></div>
        <div class="sec-body" id="aBody" style="display:none">
          <label>Claude API Key（GitHub Pages版のみ必要）</label>
          <input id="iKey" type="password" placeholder="sk-ant-..." oninput="saveKey()" style="margin-bottom:2px">
          <div style="font-size:9px;color:#aaa">Claudeアーティファクト内では不要</div>
        </div>
      </div>

    </div><!-- /sidebar -->

    <!-- Map -->
    <div id="mapWrap">
      <div id="map"></div>
      <div id="mapMsg">
        ⚠️ プレビュー環境では地図タイルは表示されません<br>
        <span style="font-size:10px">GitHub Pagesに公開すると地図が正常に表示されます</span>
      </div>
    </div>

  </div><!-- /body -->
</div><!-- /app -->

<!-- Waypoint edit modal -->
<div id="mOver" onclick="if(event.target===this)closeModal()">
  <div id="mBox">
    <div id="mHdr">
      <span>ウェイポイント編集</span>
      <button onclick="closeModal()" style="background:none;border:none;color:inherit;font-size:17px;cursor:pointer;line-height:1">✕</button>
    </div>
    <div id="mBody">
      <label>種別</label>
      <select id="mType"></select>
      <label>名称</label>
      <input id="mName" placeholder="スポット名">
      <label>説明・補足（地図に掲載する情報）</label>
      <textarea id="mDesc" placeholder="例：農水省認定・171枚の棚田が広がる"></textarea>
      <label>電話番号・URL（飲食店等）</label>
      <input id="mTel" placeholder="例：090-1234-5678">
    </div>
    <div id="mFtr">
      <button class="btn btn-rd" onclick="deleteEditing()">🗑 このポイントを削除</button>
      <div style="display:flex;gap:6px">
        <button class="btn" onclick="closeModal()">キャンセル</button>
        <button class="btn on" onclick="saveModal()">💾 保存</button>
      </div>
    </div>
  </div>
</div>

<!-- Result panel -->
<div id="resPanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <strong style="font-size:13px;color:#3E2A0E">✨ 生成されたプロンプト</strong>
    <button class="btn" onclick="closeRes()">✕ 閉じる</button>
  </div>
  <div id="resContent"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =====================================================
   CONSTANTS
   ===================================================== */
const WT = [
  {v:'course',  l:'コースポイント（番号付き）', c:'#C4703A'},
  {v:'start',   l:'スタート / ゴール',          c:'#2E7D32'},
  {v:'view',    l:'ビュースポット',              c:'#1565C0'},
  {v:'shop',    l:'飲食店・ショップ ★',          c:'#C62828'},
  {v:'shrine',  l:'神社・寺院',                  c:'#6D4C41'},
  {v:'history', l:'史跡・記念碑',                c:'#E65100'},
  {v:'park',    l:'公園・自然',                  c:'#388E3C'},
  {v:'toilet',  l:'トイレ',                      c:'#455A64'},
  {v:'parking', l:'駐車場',                      c:'#1565C0'},
  {v:'other',   l:'その他',                      c:'#757575'},
];

const SYM = {
  start:'S', view:'◎', shop:'★', shrine:'⛩',
  history:'碑', park:'🌿', toilet:'WC', parking:'P', other:'●',
};

/* =====================================================
   STATE
   ===================================================== */
let leafMap = null;
let wps = [];     // {id, type, name, desc, tel, lat, lng, marker}
let vps = [];     // {id, segAfter, lat, lng, marker}  (segAfter = wpId after which this vp sits)
let routeLine = null;
let mode = 'wp';
let editId = null;
let idW = 0, idV = 0;
let lastOp = null;  // {kind:'wp'|'vp', id} — single-step undo
let course = {name:'', area:'', desc:'', dist:''};
let _result = null; // last generated prompts

/* =====================================================
   INIT
   ===================================================== */
window.addEventListener('DOMContentLoaded', () => {
  // Build modal type <select>
  const sel = document.getElementById('mType');
  WT.forEach(t => {
    const o = document.createElement('option');
    o.value = t.v;
    o.textContent = t.l;
    sel.appendChild(o);
  });

  // Restore API key
  const k = localStorage.getItem('fp_key');
  if (k) document.getElementById('iKey').value = k;

  // Init Leaflet
  leafMap = L.map('map', {center:[35.165, 134.542], zoom:14});

  const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap contributors',
    maxZoom:19,
  }).addTo(leafMap);

  // Hide OSM notice when at least one tile loads
  tiles.on('tileload', () => {
    const el = document.getElementById('mapMsg');
    if (el) el.style.display = 'none';
  });

  leafMap.on('click', onMapClick);
});

/* =====================================================
   MAP CLICK
   ===================================================== */
function onMapClick(e) {
  if (mode === 'wp')  addWp(e.latlng.lat, e.latlng.lng);
  if (mode === 'via') addVp(e.latlng.lat, e.latlng.lng);
}

/* =====================================================
   WAYPOINTS
   ===================================================== */
function addWp(lat, lng) {
  idW++;
  const wp = {id:idW, type:'course', name:'', desc:'', tel:'', lat, lng, marker:null};
  wps.push(wp);
  wp.marker = buildWpMarker(wp);
  lastOp = {kind:'wp', id:idW};
  redrawLine();
  redrawList();
  refreshIcons();
}

function buildWpMarker(wp) {
  const m = L.marker([wp.lat, wp.lng], {draggable:true, icon:wpIcon(wp)}).addTo(leafMap);

  // Drag: update coords, redraw line
  m.on('drag', () => {
    wp.lat = m.getLatLng().lat;
    wp.lng = m.getLatLng().lng;
    redrawLine();
  });

  // Click: open modal (stop propagation so map click doesn't also fire)
  m.on('click', e => {
    L.DomEvent.stopPropagation(e);
    openModal(wp.id);
  });

  return m;
}

function wpIcon(wp) {
  const t = WT.find(x => x.v === wp.type) || WT[0];
  const sym = wp.type === 'course' ? (courseNum(wp) || '?') : (SYM[wp.type] || '●');
  return L.divIcon({
    className: '',
    html: `<div style="
      width:30px;height:30px;border-radius:50%;
      background:${t.c};color:#fff;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:bold;
      border:2px solid rgba(255,255,255,.8);
      box-shadow:0 2px 6px rgba(0,0,0,.4);
      cursor:pointer;
    ">${sym}</div>`,
    iconSize:[30,30],
    iconAnchor:[15,15],
  });
}

function courseNum(wp) {
  const list = wps.filter(w => w.type === 'course');
  const i = list.findIndex(w => w.id === wp.id);
  return i >= 0 ? i + 1 : null;
}

function refreshIcons() {
  wps.forEach(wp => { if (wp.marker) wp.marker.setIcon(wpIcon(wp)); });
}

function deleteWp(id) {
  // Remove associated via points
  vps.filter(v => v.segAfter === id).forEach(v => {
    if (v.marker) leafMap.removeLayer(v.marker);
  });
  vps = vps.filter(v => v.segAfter !== id);

  // Remove marker
  const wp = wps.find(w => w.id === id);
  if (wp && wp.marker) leafMap.removeLayer(wp.marker);

  wps = wps.filter(w => w.id !== id);
  redrawLine();
  refreshIcons();
  redrawList();
}

/* =====================================================
   VIA POINTS (route adjustment)
   ===================================================== */
function addVp(lat, lng) {
  if (wps.length < 2) {
    alert('ウェイポイントを2点以上追加してから経路調整点を追加してください。');
    return;
  }
  const segAfter = nearestSegWpId(lat, lng);
  idV++;
  const vp = {id:'v'+idV, segAfter, lat, lng, marker:null};
  vps.push(vp);
  vp.marker = buildVpMarker(vp);
  lastOp = {kind:'vp', id:'v'+idV};
  redrawLine();
}

function buildVpMarker(vp) {
  const m = L.marker([vp.lat, vp.lng], {
    draggable: true,
    icon: L.divIcon({
      className: '',
      html: `<div title="右クリックで削除" style="
        width:12px;height:12px;border-radius:50%;
        background:#666;border:2px solid #fff;
        box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:move;
      "></div>`,
      iconSize:[12,12], iconAnchor:[6,6],
    }),
  }).addTo(leafMap);

  m.on('drag', () => {
    vp.lat = m.getLatLng().lat;
    vp.lng = m.getLatLng().lng;
    redrawLine();
  });

  // Right-click to delete via point
  m.on('contextmenu', () => {
    leafMap.removeLayer(m);
    vps = vps.filter(v => v.id !== vp.id);
    redrawLine();
  });

  return m;
}

// Find the waypoint ID such that the segment [wp_i → wp_{i+1}] is closest to (lat,lng)
function nearestSegWpId(lat, lng) {
  let bestId = wps[wps.length - 2].id;
  let minDist = Infinity;
  for (let i = 0; i < wps.length - 1; i++) {
    const d = ptSegDist(
      [lat, lng],
      [wps[i].lat, wps[i].lng],
      [wps[i+1].lat, wps[i+1].lng]
    );
    if (d < minDist) { minDist = d; bestId = wps[i].id; }
  }
  return bestId;
}

// Perpendicular distance from point p to segment [a,b]
function ptSegDist(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  if (Math.abs(dx) < 1e-12 && Math.abs(dy) < 1e-12) {
    return Math.hypot(p[0] - a[0], p[1] - a[1]);
  }
  const t = Math.max(0, Math.min(1,
    ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy)
  ));
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}

/* =====================================================
   POLYLINE
   ===================================================== */
function redrawLine() {
  if (routeLine) { leafMap.removeLayer(routeLine); routeLine = null; }
  if (wps.length < 2) return;

  const coords = buildCoords();
  routeLine = L.polyline(coords, {
    color:'#E84040', weight:3, dashArray:'8,5', opacity:.9,
  }).addTo(leafMap);

  // Keep waypoint markers above the polyline
  wps.forEach(wp => { if (wp.marker) wp.marker.bringToFront(); });
}

function buildCoords() {
  const coords = [];
  for (let i = 0; i < wps.length; i++) {
    coords.push([wps[i].lat, wps[i].lng]);

    // Insert via points for the segment [wps[i] → wps[i+1]]
    if (i + 1 < wps.length) {
      const a = [wps[i].lat, wps[i].lng];
      const b = [wps[i+1].lat, wps[i+1].lng];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len2 = dx * dx + dy * dy;

      vps
        .filter(v => v.segAfter === wps[i].id)
        .map(v => {
          // Project v onto segment to get sort order
          const t = len2 > 0
            ? ((v.lat - a[0]) * dx + (v.lng - a[1]) * dy) / len2
            : 0;
          return {v, t};
        })
        .sort((a, b) => a.t - b.t)
        .forEach(({v}) => coords.push([v.lat, v.lng]));
    }
  }
  return coords;
}

/* =====================================================
   WAYPOINT LIST (sidebar)
   ===================================================== */
function redrawList() {
  const el = document.getElementById('wpList');
  const empty = document.getElementById('wpEmpty');

  // Remove old rows (keep the empty placeholder)
  el.querySelectorAll('.wp-row').forEach(r => r.remove());

  if (wps.length === 0) {
    if (empty) empty.style.display = '';
    return;
  }
  if (empty) empty.style.display = 'none';

  let cn = 1;
  wps.forEach(wp => {
    const t = WT.find(x => x.v === wp.type) || WT[0];
    const sym = wp.type === 'course' ? cn++ : (SYM[wp.type] || '●');
    const label = wp.name || `（${t.l}）`;

    const row = document.createElement('div');
    row.className = 'wp-row';
    row.innerHTML = `
      <div class="wp-dot" style="background:${t.c}">${sym}</div>
      <div class="wp-label">${label}</div>
      <div class="wp-edit-btn">✏</div>
    `;
    row.addEventListener('click', () => flyEdit(wp.id));
    row.querySelector('.wp-edit-btn').addEventListener('click', e => {
      e.stopPropagation();
      openModal(wp.id);
    });
    el.appendChild(row);
  });
}

function flyEdit(id) {
  const wp = wps.find(w => w.id === id);
  if (!wp) return;
  leafMap.flyTo([wp.lat, wp.lng], Math.max(leafMap.getZoom(), 15), {duration:.5});
  setTimeout(() => openModal(id), 350);
}

/* =====================================================
   MODAL
   ===================================================== */
function openModal(id) {
  editId = id;
  const wp = wps.find(w => w.id === id);
  if (!wp) return;
  document.getElementById('mType').value = wp.type;
  document.getElementById('mName').value = wp.name;
  document.getElementById('mDesc').value = wp.desc;
  document.getElementById('mTel').value  = wp.tel;
  document.getElementById('mOver').classList.add('show');
  setTimeout(() => document.getElementById('mName').focus(), 50);
}

function closeModal() {
  document.getElementById('mOver').classList.remove('show');
  editId = null;
}

function saveModal() {
  if (editId === null) return;
  const wp = wps.find(w => w.id === editId);
  if (!wp) return;
  wp.type = document.getElementById('mType').value;
  wp.name = document.getElementById('mName').value;
  wp.desc = document.getElementById('mDesc').value;
  wp.tel  = document.getElementById('mTel').value;
  if (wp.marker) wp.marker.setIcon(wpIcon(wp));
  closeModal();
  refreshIcons();
  redrawList();
}

function deleteEditing() {
  if (editId === null) return;
  if (!confirm('このウェイポイントを削除しますか？')) return;
  const id = editId;
  closeModal();
  deleteWp(id);
}

/* =====================================================
   MODE / UNDO / CLEAR
   ===================================================== */
function setMode(m) {
  mode = m;
  document.getElementById('btnWp').classList.toggle('on',  m === 'wp');
  document.getElementById('btnVia').classList.toggle('on', m === 'via');
  document.getElementById('status').textContent = m === 'wp'
    ? '地図をクリックしてウェイポイントを追加'
    : '地図をクリックして経路調整点を追加（右クリックで削除）';
}

function undoLast() {
  if (!lastOp) return;
  const op = lastOp;
  lastOp = null; // clear before side effects
  if (op.kind === 'wp') {
    deleteWp(op.id);
  } else {
    const vp = vps.find(v => v.id === op.id);
    if (vp) {
      if (vp.marker) leafMap.removeLayer(vp.marker);
      vps = vps.filter(v => v.id !== op.id);
      redrawLine();
    }
  }
}

function clearAll() {
  if (wps.length === 0 && vps.length === 0) return;
  if (!confirm('すべてのウェイポイントと経路調整点を消去しますか？')) return;
  wps.forEach(wp => { if (wp.marker) leafMap.removeLayer(wp.marker); });
  vps.forEach(vp => { if (vp.marker) leafMap.removeLayer(vp.marker); });
  wps = []; vps = []; lastOp = null;
  if (routeLine) { leafMap.removeLayer(routeLine); routeLine = null; }
  redrawList();
}

/* =====================================================
   PROMPT GENERATION
   ===================================================== */
function openGen() {
  document.getElementById('resPanel').classList.add('show');
  document.getElementById('resContent').innerHTML =
    '<div style="text-align:center;padding:30px;color:#888;font-size:12px">⏳ 生成中...</div>';
  doGenerate();
}

function closeRes() {
  document.getElementById('resPanel').classList.remove('show');
}

async function doGenerate() {
  try {
    const prompt = buildApiPrompt();
    const key = document.getElementById('iKey').value.trim();
    const headers = {'Content-Type':'application/json'};
    if (key) headers['x-api-key'] = key;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4096,
        messages: [{role:'user', content:prompt}],
      }),
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const text = data.content
      .filter(c => c.type === 'text')
      .map(c => c.text)
      .join('');

    // Strip markdown code fences if present, then extract JSON object
    const cleaned = text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
    const match = cleaned.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('JSONの抽出に失敗しました。もう一度お試しください。');

    _result = JSON.parse(match[0]);
    renderResult(_result);

  } catch (e) {
    document.getElementById('resContent').innerHTML =
      `<div style="color:#B71C1C;font-size:12px;padding:10px;background:#FFEBEE;border-radius:4px">
        ❌ エラー: ${e.message}
      </div>`;
  }
}

function renderResult(r) {
  const items = [
    {k:'midjourney', l:'🎨 Midjourney v6',                 h:'/imagineコマンドに貼り付け'},
    {k:'dalle',      l:'🖼 DALL-E 3',                      h:'ChatGPT PlusまたはOpenAI API'},
    {k:'sd_pos',     l:'⚙ Stable Diffusion（ポジティブ）', h:'Positive Promptに貼り付け'},
    {k:'sd_neg',     l:'⚙ Stable Diffusion（ネガティブ）', h:'Negative Promptに貼り付け'},
    {k:'map_text',   l:'📄 マップヘッダー文章（日本語）',  h:'地図のヘッダーに掲載するテキスト'},
  ];

  let html = '';
  items.forEach(({k, l, h}) => {
    if (!r[k]) return;
    const safe = r[k].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html += `<div class="res-blk">
      <div class="res-top">
        <div class="res-lbl">${l}</div>
        <button class="cp-btn" onclick="cpText('${k}')">📋 コピー</button>
      </div>
      <div class="res-hint">${h}</div>
      <div class="res-txt">${safe}</div>
    </div>`;
  });

  if (Array.isArray(r.tips) && r.tips.length) {
    html += `<div class="res-blk">
      <div class="res-lbl">💡 制作アドバイス</div>
      <ul style="font-size:10px;line-height:1.9;padding-left:14px;margin-top:6px">
        ${r.tips.map(t => `<li>${t}</li>`).join('')}
      </ul>
    </div>`;
  }

  document.getElementById('resContent').innerHTML = html;
}

function cpText(k) {
  if (!_result || !_result[k]) return;
  navigator.clipboard.writeText(_result[k]).catch(() => {});
}

function buildApiPrompt() {
  const courseWps = wps.filter(w => w.type === 'course');
  const otherWps  = wps.filter(w => w.type !== 'course');

  const ptLines = courseWps.map((w, i) =>
    `  ${i+1}. ${w.name || '（名称未設定）'}${w.desc ? '：' + w.desc : ''}`
  ).join('\n');

  const spotLines = otherWps.map(w => {
    const t = WT.find(x => x.v === w.type);
    return `  [${t ? t.l : w.type}] ${w.name}${w.desc ? '：' + w.desc : ''}${w.tel ? '　TEL:' + w.tel : ''}`;
  }).join('\n');

  const bbox = wps.length > 0 ? {
    n: Math.max(...wps.map(w => w.lat)).toFixed(5),
    s: Math.min(...wps.map(w => w.lat)).toFixed(5),
    e: Math.max(...wps.map(w => w.lng)).toFixed(5),
    w: Math.min(...wps.map(w => w.lng)).toFixed(5),
  } : null;

  return `あなたはフットパス観光マップのAIイラスト生成プロンプト作成の専門家です。
以下のコース情報をもとに、日本の観光パンフレットに使われる手描き水彩イラスト風の俯瞰地図を
AIイラスト生成ツールで作るための詳細なプロンプトを作成してください。

【参考スタイル】
・日本の地域フットパスマップの手描き水彩イラスト俯瞰図
・山・丘陵は緑の水彩で柔らかく立体的に表現
・住宅地・市街地はクリーム〜淡いピンク色
・川・水路は青〜水色
・コースは赤い破線で表示
・番号付き丸いアイコンでコースポイントを示す
・飲食店・ショップは赤い★マーク
・鳥・植物など自然の装飾要素を四隅に配置
・日本語のラベルと説明文を地図内に書き込む
・北矢印とスケールバーを含む

【コース情報】
コース名: ${course.name || '（未設定）'}
地域・エリア: ${course.area || '（未設定）'}
説明・見どころ: ${course.desc || '（なし）'}
総距離: ${course.dist || '不明'}km
ウェイポイント総数: ${wps.length}点
${bbox ? `地図範囲: 北${bbox.n}° 南${bbox.s}° 東${bbox.e}° 西${bbox.w}°` : ''}

【コースポイント（番号付き丸アイコンで表示）】
${ptLines || '（なし）'}

【立ち寄りスポット】
${spotLines || '（なし）'}

【出力形式】
必ずJSON形式のみで出力してください（前後に説明文・コードブロック記号は不要）:
{
  "midjourney": "（Midjourney v6用詳細英語プロンプト。末尾に --ar 4:3 --style raw --q 2 を含める）",
  "dalle": "（DALL-E 3用詳細英語プロンプト）",
  "sd_pos": "（Stable Diffusion用ポジティブプロンプト（英語））",
  "sd_neg": "（ネガティブプロンプト（英語））",
  "map_text": "（マップヘッダー用の日本語説明文2〜3文。コースの魅力・歴史・自然を紹介）",
  "tips": ["制作アドバイス1（日本語）", "制作アドバイス2（日本語）", "制作アドバイス3（日本語）"]
}`;
}
</script>
