<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VP Test</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#ffffff;font-family:monospace}
  /* 候補: fixed + 100vh が物理画面いっぱい(上端0〜下端874)に届くか。緑=地図相当 */
  #fill{position:fixed;top:0;left:0;right:0;height:100vh;background:#5fa845;z-index:1}
  /* セーフエリア可視化(操作ボタンを置く安全帯) */
  #saTop{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:rgba(255,140,0,.55);z-index:5}
  #saBot{position:fixed;bottom:0;left:0;right:0;height:env(safe-area-inset-bottom);background:rgba(255,140,0,.55);z-index:5}
  #fillBottomLine{position:fixed;left:0;right:0;height:0;border-top:3px solid #d00000;z-index:6}
  #vpBottomLine{position:fixed;left:0;right:0;bottom:0;height:0;border-top:3px solid #0040ff;z-index:6}
  #panel{position:fixed;top:env(safe-area-inset-top);left:env(safe-area-inset-left);background:rgba(0,0,0,.85);color:#fff;font-size:11px;line-height:1.5;padding:8px 10px;white-space:pre;z-index:10;max-width:84vw;border-radius:0 0 8px 0}
  .tag{position:fixed;font-size:10px;color:#fff;background:rgba(0,0,0,.6);padding:1px 4px;z-index:7}
</style>
</head>
<body>
  <div id="fill"></div>
  <div id="saTop"></div>
  <div id="saBot"></div>
  <div id="fillBottomLine"></div>
  <div id="vpBottomLine"></div>
  <div class="tag" style="bottom:0;left:4px">青=innerHeight下端</div>
  <div id="panel"></div>
<script>
(function(){
  function px(n){return (n==null||isNaN(n))?'-':Math.round(n*10)/10;}
  function probe(h){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;width:0;visibility:hidden;height:'+h;document.body.appendChild(d);var r=d.getBoundingClientRect().height;d.remove();return r;}
  var sa=document.createElement('div');
  sa.style.cssText='position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(sa);
  var fill=document.getElementById('fill'), line=document.getElementById('fillBottomLine'), panel=document.getElementById('panel');
  function upd(){
    var cs=getComputedStyle(sa);
    var saT=parseFloat(cs.paddingTop)||0,saB=parseFloat(cs.paddingBottom)||0,saL=parseFloat(cs.paddingLeft)||0,saR=parseFloat(cs.paddingRight)||0;
    var vh=probe('100vh'),dvh=probe('100dvh'),lvh=probe('100lvh');
    var fr=fill.getBoundingClientRect();
    line.style.top=fr.bottom+'px';
    var band=vh-fr.bottom;
    var saNav=('standalone' in navigator)?navigator.standalone:null;
    var L=[];
    L.push('VP TEST  standalone='+saNav);
    L.push('screen '+px(screen.width)+'x'+px(screen.height)+' dpr='+window.devicePixelRatio);
    L.push('inner '+px(window.innerWidth)+'x'+px(window.innerHeight)+' docH='+px(document.documentElement.clientHeight));
    L.push('100vh='+px(vh)+'  100dvh='+px(dvh)+'  100lvh='+px(lvh));
    L.push('safe T/B/L/R = '+px(saT)+'/'+px(saB)+'/'+px(saL)+'/'+px(saR));
    L.push('\u7dd1(fixed+100vh) top\u2192bottom = '+px(fr.top)+'\u2192'+px(fr.bottom)+' / h='+px(fr.height));
    L.push('=============================');
    L.push('\u2605 \u7dd1\u304c\u7269\u7406\u4e0b\u7aef\u306b\u5c4a\u304f\u304b');
    L.push('\u2605 100vh - \u7dd1\u4e0b\u7aef = '+px(vh)+' - '+px(fr.bottom)+' = '+px(band)+' px '+(Math.abs(band)<=1?'\u2713\u5c4a\u3044\u3066\u308b':'\u26a0\u767d\u5e2f'+px(band)));
    panel.textContent=L.join('\n');
  }
  upd();
  ['resize','orientationchange','load'].forEach(function(e){window.addEventListener(e,upd,{passive:true});});
  if(window.visualViewport){window.visualViewport.addEventListener('resize',upd);}
  [200,600,1500,3000].forEach(function(t){setTimeout(upd,t);});
  setInterval(upd,1000);
})();
</script>
</body>
</html>
