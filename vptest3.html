<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VP Test 3</title>
<style>
  html,body{margin:0;min-height:calc(100% + env(safe-area-inset-top));overflow:hidden;background:#cccccc;font-family:monospace}
  /* ===== 本番と同じ入れ子構造 ===== */
  /* 候補手法: #s2 を fixed + height:calc(100% + safe上) にして、入れ子の地図箱まで下端へ伸ばす */
  #s2{position:fixed;top:0;left:0;right:0;height:calc(100% + env(safe-area-inset-top));display:flex;flex-direction:column}
  #main{position:absolute;inset:0}
  #mapArea{position:absolute;inset:0;display:block}
  #mapWrap{position:absolute;inset:0}
  #map{width:100%;height:100%;background:#5fa845}   /* 緑 = 地図相当。下端まで届けば成功 */

  /* セーフエリア可視化 / 計測補助 */
  #saTop{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:rgba(255,140,0,.5);z-index:5}
  #saBot{position:fixed;bottom:0;left:0;right:0;height:env(safe-area-inset-bottom);background:rgba(255,140,0,.5);z-index:5}
  #vpBottomLine{position:fixed;left:0;right:0;bottom:0;height:0;border-top:3px solid #0040ff;z-index:6}
  #vpTag{position:fixed;left:4px;bottom:3px;font-size:10px;color:#fff;background:rgba(0,0,0,.6);padding:1px 4px;z-index:7}
  #panel{position:fixed;top:env(safe-area-inset-top);left:0;background:rgba(0,0,0,.85);color:#fff;font:11px/1.45 monospace;padding:8px 10px;white-space:pre;z-index:10;max-width:92vw;border-radius:0 0 8px 0}
</style>
</head>
<body>
  <div id="s2"><div id="main"><div id="mapArea"><div id="mapWrap"><div id="map"></div></div></div></div></div>
  <div id="saTop"></div>
  <div id="saBot"></div>
  <div id="vpBottomLine"></div>
  <div id="vpTag">青=innerHeight下端 / 灰=隙間 / 緑=地図箱</div>
  <div id="panel"></div>
<script>
(function(){
  function px(n){return (n==null||isNaN(n))?'-':Math.round(n*10)/10;}
  function probe(h){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;width:0;visibility:hidden;height:'+h;document.body.appendChild(d);var v=d.getBoundingClientRect().height;d.remove();return v;}
  var sa=document.createElement('div');
  sa.style.cssText='position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(sa);
  var panel=document.getElementById('panel');
  function upd(){
    var cs=getComputedStyle(sa);
    var saT=parseFloat(cs.paddingTop)||0,saB=parseFloat(cs.paddingBottom)||0,saL=parseFloat(cs.paddingLeft)||0,saR=parseFloat(cs.paddingRight)||0;
    var vh=probe('100vh'),dvh=probe('100dvh');
    var s2=document.getElementById('s2').getBoundingClientRect();
    var m=document.getElementById('map').getBoundingClientRect();
    var gap=screen.height-m.bottom;          // 地図箱が物理下端(=screen.height)に届くか
    var saNav=('standalone' in navigator)?navigator.standalone:null;
    var L=[];
    L.push('VP TEST 3 (\u672c\u756a\u540c\u69cb\u9020)  standalone='+saNav);
    L.push('#s2 = fixed + height:calc(100% + safe\u4e0a)');
    L.push('screen '+px(screen.width)+'x'+px(screen.height)+' dpr='+window.devicePixelRatio);
    L.push('inner '+px(window.innerWidth)+'x'+px(window.innerHeight));
    L.push('100vh='+px(vh)+'  100dvh='+px(dvh));
    L.push('safe T/B/L/R = '+px(saT)+'/'+px(saB)+'/'+px(saL)+'/'+px(saR));
    L.push('#s2  '+px(s2.top)+'\u2192'+px(s2.bottom)+' / h='+px(s2.height));
    L.push('#map '+px(m.top)+'\u2192'+px(m.bottom)+' / h='+px(m.height));
    L.push('=============================');
    L.push('\u2605 \u5730\u56f3\u7bb1\u304c\u7269\u7406\u4e0b\u7aef\u306b\u5c4a\u304f\u304b');
    L.push('\u2605 screen - #map\u4e0b\u7aef = '+px(screen.height)+' - '+px(m.bottom)+' = '+px(gap)+' px '+(Math.abs(gap)<=2?'\u2713\u5c4a\u3044\u3066\u308b':'\u26a0\u96b3\u9593'+px(gap)));
    panel.textContent=L.join('\n');
  }
  upd();
  ['resize','orientationchange','load','scroll'].forEach(function(e){window.addEventListener(e,upd,{passive:true});});
  if(window.visualViewport){window.visualViewport.addEventListener('resize',upd);}
  [200,600,1500,3000].forEach(function(t){setTimeout(upd,t);});
  setInterval(upd,1000);
})();
</script>
</body>
</html>
