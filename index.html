<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フットパスマップメーカー</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Hiragino Sans','Meiryo',sans-serif;font-size:13px;color:#2C1B0E;overflow:hidden}

/* ===== SCREEN 1 ===== */
#s1{
  height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#F5EDD8 0%,#E8D8B8 100%);
}
.s1-card{
  background:rgba(255,255,255,.92);border-radius:16px;padding:40px 48px;
  width:min(480px,92vw);box-shadow:0 8px 40px rgba(74,46,14,.15);
  border:1px solid #D4C4A8;
}
.s1-logo{font-size:40px;text-align:center;margin-bottom:12px}
.s1-title{font-size:22px;font-weight:bold;color:#3E2A0E;text-align:center;margin-bottom:6px}
.s1-sub{font-size:12px;color:#8A6A4A;text-align:center;margin-bottom:28px}
.s1-label{display:block;font-size:11px;font-weight:bold;color:#5A3A1A;margin-bottom:4px;margin-top:14px}
.s1-input{
  width:100%;padding:9px 12px;border:1px solid #D4C4A8;border-radius:6px;
  font-size:14px;font-family:inherit;background:#FFFDF8;outline:none;color:#2C1B0E;
  transition:border-color .2s;
}
.s1-input:focus{border-color:#C4703A}
.s1-hint{font-size:10px;color:#9A7A5A;margin-top:3px}
.s1-btn{
  width:100%;margin-top:24px;padding:13px;background:#3E2A0E;color:#F5EDD8;
  border:none;border-radius:8px;font-size:15px;font-family:inherit;font-weight:bold;
  cursor:pointer;letter-spacing:.04em;transition:background .2s;
}
.s1-btn:hover{background:#5A3E1A}
.s1-btn:disabled{opacity:.5;cursor:not-allowed}

/* ===== SCREEN 2 ===== */
#s2{height:100vh;display:none;flex-direction:column}
#hdr{
  background:#3E2A0E;color:#F5EDD8;height:44px;display:flex;
  align-items:center;padding:0 12px;gap:10px;flex-shrink:0;
}
#hdr h1{font-size:13px;white-space:nowrap}
#cnDisp{font-size:11px;opacity:.7;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{display:flex;flex:1;overflow:hidden}

/* ===== SIDEBAR ===== */
#sidebar{
  width:256px;flex-shrink:0;background:#FAF6EE;
  border-right:1px solid #D4C4A8;display:flex;flex-direction:column;overflow:hidden;
}
.sec{border-bottom:1px solid #D4C4A8;flex-shrink:0}
.sec-hdr{
  padding:7px 12px;font-size:11px;font-weight:bold;color:#4A2E0E;background:#F0E8D8;
  cursor:pointer;display:flex;justify-content:space-between;user-select:none;
}
.sec-body{padding:8px 12px}
.sec-body label{display:block;font-size:10px;color:#666;font-weight:bold;margin-bottom:2px}
.sec-body input,.sec-body textarea,.sec-body select{
  width:100%;padding:4px 7px;border:1px solid #D4C4A8;border-radius:3px;
  font-size:11px;font-family:inherit;background:#fff;outline:none;margin-bottom:6px;
}
.sec-body textarea{resize:vertical;min-height:60px}

/* Waypoint list (draggable) */
#wpSec{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
#wpList{flex:1;overflow-y:auto;padding:2px 0}
.wp-row{
  display:flex;align-items:center;gap:5px;padding:4px 10px;
  border-bottom:1px solid #EEE8DE;cursor:grab;user-select:none;
  transition:background .1s;
}
.wp-row:hover{background:#F0E8D8}
.wp-row.dragging{opacity:.4;background:#E8D8C8}
.wp-row.drag-over{border-top:2px solid #C4703A}
.wp-dot{
  width:22px;height:22px;border-radius:50%;color:#fff;
  font-size:10px;font-weight:bold;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
}
.wp-name{font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wp-edit-btn{font-size:11px;color:#C4703A;flex-shrink:0;padding:1px 4px;cursor:pointer}
.wp-empty{font-size:10px;color:#aaa;text-align:center;padding:14px}

/* Distance and description */
#distSec{padding:8px 12px;background:#F0EAE0;border-top:1px solid #D4C4A8;border-bottom:1px solid #D4C4A8;flex-shrink:0}
#distDisp{font-size:12px;font-weight:bold;color:#4A2E0E}
#descSec{padding:8px 12px;flex-shrink:0}
#descSec label{display:block;font-size:10px;font-weight:bold;color:#666;margin-bottom:3px}
#iDesc{width:100%;padding:5px 7px;border:1px solid #D4C4A8;border-radius:3px;font-size:11px;font-family:inherit;background:#fff;outline:none;resize:vertical;min-height:60px}

/* API key section */
#apiSec{border-top:1px solid #D4C4A8}

/* ===== MAP AREA ===== */
#mapArea{flex:1;display:flex;flex-direction:column;overflow:hidden}
#tbar{
  background:#F5EDD8;border-bottom:1px solid #D4C4A8;padding:4px 10px;
  display:flex;align-items:center;gap:5px;flex-shrink:0;flex-wrap:wrap;
}
#tbar-status{font-size:10px;color:#888;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mapWrap{flex:1;position:relative}
#map{width:100%;height:100%}
#mapMsg{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(255,255,255,.88);border:1px solid #D4C4A8;border-radius:6px;
  padding:10px 16px;font-size:11px;text-align:center;z-index:500;pointer-events:none;line-height:1.7;
}

/* ===== AI SELECTOR BAR ===== */
#aiBar{
  background:#3E2A0E;padding:6px 12px;display:flex;align-items:center;gap:8px;
  flex-shrink:0;border-top:1px solid rgba(255,255,255,.1);
}
#aiBar label{color:#F5EDD8;font-size:11px;white-space:nowrap}
#aiSel{
  padding:4px 8px;border:1px solid rgba(255,255,255,.2);border-radius:4px;
  background:rgba(255,255,255,.12);color:#F5EDD8;font-size:11px;font-family:inherit;outline:none;flex:1;
}
#aiSel option{background:#3E2A0E;color:#F5EDD8}

/* ===== BUTTONS ===== */
.btn{padding:4px 9px;border:1px solid #C4B89A;border-radius:4px;background:#fff;cursor:pointer;font-size:11px;font-family:inherit;white-space:nowrap;line-height:1.4}
.btn:hover{background:#F5EDD8}
.btn.on{background:#C4703A;color:#fff;border-color:#C4703A}
.btn-lt{background:rgba(255,255,255,.15);color:#F5EDD8;border-color:rgba(255,255,255,.25);padding:5px 14px;font-size:12px;font-weight:bold;font-family:inherit;cursor:pointer;border-radius:5px;white-space:nowrap}
.btn-lt:hover{background:rgba(255,255,255,.25)}
.btn-rd{background:#B71C1C;color:#fff;border-color:#B71C1C}

/* ===== MODAL ===== */
#mOver{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;align-items:center;justify-content:center}
#mOver.show{display:flex}
#mBox{background:#fff;border-radius:8px;width:min(360px,94vw);max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.35)}
#mHdr{background:#3E2A0E;color:#F5EDD8;padding:10px 14px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:bold}
#mBody{padding:14px}
#mBody label{display:block;font-size:10px;font-weight:bold;color:#555;margin-bottom:2px}
#mBody input,#mBody select,#mBody textarea{width:100%;padding:5px 8px;border:1px solid #D4C4A8;border-radius:4px;font-size:12px;font-family:inherit;background:#fff;outline:none;margin-bottom:10px}
#mBody textarea{resize:vertical;min-height:52px}
#mFtr{padding:10px 14px;border-top:1px solid #EEE;display:flex;justify-content:space-between;align-items:center}

/* ===== RESULT PANEL ===== */
#resPanel{display:none;position:fixed;top:44px;right:0;bottom:0;width:min(400px,90vw);background:#fff;border-left:1px solid #D4C4A8;z-index:2000;overflow-y:auto;padding:14px;box-shadow:-4px 0 16px rgba(0,0,0,.12)}
#resPanel.show{display:block}
.res-blk{background:#F8F4EC;border:1px solid #D4C4A8;border-radius:5px;padding:10px;margin-bottom:10px}
.res-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.res-lbl{font-size:10px;font-weight:bold;color:#555;text-transform:uppercase;letter-spacing:.05em}
.res-hint{font-size:9px;color:#999;margin-bottom:5px}
.res-txt{font-size:10px;line-height:1.7;font-family:monospace;white-space:pre-wrap;word-break:break-all}
.cp-btn{padding:2px 8px;background:#4A7A5C;color:#fff;border:none;border-radius:3px;font-size:9px;cursor:pointer;font-family:inherit}

/* ===== TOOLTIP ===== */
.wp-tt{
  background:rgba(62,42,14,.85)!important;color:#F5EDD8!important;
  border:none!important;border-radius:4px!important;font-size:11px!important;
  padding:2px 7px!important;white-space:nowrap!important;box-shadow:0 2px 6px rgba(0,0,0,.3)!important;
}
.wp-tt::before{display:none!important}
</style>
</head>
<body>

<!-- ===== SCREEN 1 ===== -->
<div id="s1">
  <div class="s1-card">
    <div class="s1-logo">🗾</div>
    <div class="s1-title">フットパスマップメーカー</div>
    <div class="s1-sub">コース情報を入力してマップ作成を開始します</div>

    <label class="s1-label">コース名 *</label>
    <input class="s1-input" id="s1Name" placeholder="例：飯見の棚田おにぎりウォーク">

    <label class="s1-label">コースのエリア（住所・地名）*</label>
    <input class="s1-input" id="s1Area" placeholder="例：兵庫県宍粟市波賀町飯見">
    <div class="s1-hint">この住所を中心にマップが表示されます</div>

    <label class="s1-label">スタート地点</label>
    <input class="s1-input" id="s1Start" placeholder="例：波賀B&G海洋センター（省略可）">

    <label class="s1-label">ゴール地点</label>
    <input class="s1-input" id="s1Goal" placeholder="例：同（周回コース）（省略可）">

    <button class="s1-btn" id="s1Btn" onclick="goToMap()">コース設定画面へ →</button>
  </div>
</div>

<!-- ===== SCREEN 2 ===== -->
<div id="s2">
  <div id="hdr">
    <span style="font-size:16px">🗾</span>
    <h1>フットパスマップメーカー</h1>
    <div id="cnDisp"></div>
    <button class="btn" style="background:rgba(255,255,255,.15);color:#F5EDD8;border-color:rgba(255,255,255,.25);margin-left:auto;flex-shrink:0" onclick="backToSetup()">← 設定に戻る</button>
  </div>

  <div id="main">
    <!-- Sidebar -->
    <div id="sidebar">

      <!-- Waypoint list -->
      <div id="wpSec">
        <div class="sec-hdr" style="cursor:default">
          📍 ウェイポイント
          <span style="font-size:10px;color:#8A6A4A;font-weight:normal">ドラッグで順番変更</span>
        </div>
        <div id="wpList">
          <div class="wp-empty" id="wpEmpty">地図をクリックしてウェイポイントを追加</div>
        </div>
      </div>

      <!-- Total distance (auto) -->
      <div id="distSec">
        <div id="distDisp">総距離: — km</div>
      </div>

      <!-- Description -->
      <div id="descSec">
        <label>コース見どころ・説明</label>
        <textarea id="iDesc" placeholder="コースの特徴・見どころ・歴史など..."></textarea>
      </div>

      <!-- API key -->
      <div class="sec" id="apiSec">
        <div class="sec-hdr" onclick="toggleSec('apiBody','apiArr')">🔑 API設定 <span id="apiArr">▶</span></div>
        <div class="sec-body" id="apiBody" style="display:none">
          <label>Claude API Key</label>
          <input id="iKey" type="password" placeholder="sk-ant-..." oninput="saveKey()">
          <div style="font-size:9px;color:#aaa;margin-top:-4px">GitHub Pages版で必要。Claudeアーティファクト内では不要。</div>
        </div>
      </div>

    </div><!-- /sidebar -->

    <!-- Map area -->
    <div id="mapArea">
      <div id="tbar">
        <span style="font-size:10px;color:#666;white-space:nowrap">モード:</span>
        <button class="btn on" id="btnWp"  onclick="setMode('wp')">📍 ウェイポイント</button>
        <button class="btn"    id="btnVia" onclick="setMode('via')">↔ 経路調整点</button>
        <span style="color:#D4C4A8">|</span>
        <button class="btn" onclick="undoLast()">↩</button>
        <button class="btn" onclick="clearAll()">🗑</button>
        <span id="tbar-status">地図クリックでウェイポイント追加 / ルート線ドラッグで経路調整</span>
      </div>
      <div id="mapWrap">
        <div id="map"></div>
        <div id="mapMsg">
          ⚠️ プレビュー環境では地図タイルは表示されません<br>
          <span style="font-size:10px">GitHub Pagesに公開すると地図が正常に表示されます</span>
        </div>
      </div>
      <!-- AI selector + generate -->
      <div id="aiBar">
        <label>画像生成AI:</label>
        <select id="aiSel">
          <option value="midjourney">Midjourney v6</option>
          <option value="dalle">DALL-E 3</option>
          <option value="sd">Stable Diffusion (ComfyUI/A1111)</option>
          <option value="firefly">Adobe Firefly</option>
          <option value="ideogram">Ideogram</option>
          <option value="other">その他（汎用）</option>
        </select>
        <button class="btn-lt" onclick="openGen()">✨ プロンプト生成</button>
      </div>
    </div><!-- /mapArea -->
  </div><!-- /main -->
</div><!-- /s2 -->

<!-- ===== MODAL ===== -->
<div id="mOver" onclick="if(event.target===this)closeModal()">
  <div id="mBox">
    <div id="mHdr">
      <span>ウェイポイント編集</span>
      <button onclick="closeModal()" style="background:none;border:none;color:inherit;font-size:17px;cursor:pointer;line-height:1">✕</button>
    </div>
    <div id="mBody">
      <label>種別</label>
      <select id="mType"></select>
      <label>名称（地図上にポップアップ表示）</label>
      <input id="mName" placeholder="スポット名">
      <label>説明・補足</label>
      <textarea id="mDesc2" placeholder="例：農水省認定・171枚の棚田が広がる"></textarea>
      <label>電話番号・URL</label>
      <input id="mTel" placeholder="例：090-1234-5678">
    </div>
    <div id="mFtr">
      <button class="btn btn-rd" onclick="deleteEditing()">🗑 削除</button>
      <div style="display:flex;gap:6px">
        <button class="btn" onclick="closeModal()">キャンセル</button>
        <button class="btn on" onclick="saveModal()">💾 保存</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== RESULT PANEL ===== -->
<div id="resPanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <strong style="font-size:13px;color:#3E2A0E">✨ 生成されたプロンプト</strong>
    <button class="btn" onclick="closeRes()">✕ 閉じる</button>
  </div>
  <div id="resContent"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   CONSTANTS
   ============================================================ */
const WT = [
  {v:'course',  l:'コースポイント（番号付き）', c:'#C4703A'},
  {v:'start',   l:'スタート / ゴール',          c:'#2E7D32'},
  {v:'view',    l:'ビュースポット',              c:'#1565C0'},
  {v:'shop',    l:'飲食店・ショップ ★',          c:'#C62828'},
  {v:'shrine',  l:'神社・寺院',                  c:'#6D4C41'},
  {v:'history', l:'史跡・記念碑',                c:'#E65100'},
  {v:'park',    l:'公園・自然',                  c:'#388E3C'},
  {v:'toilet',  l:'トイレ',                      c:'#455A64'},
  {v:'parking', l:'駐車場',                      c:'#1565C0'},
  {v:'other',   l:'その他',                      c:'#757575'},
];
const SYM = {start:'S',view:'◎',shop:'★',shrine:'⛩',history:'碑',park:'🌿',toilet:'WC',parking:'P',other:'●'};
const LINE_STYLE = {color:'#E84040', weight:4, dashArray:'8,5', opacity:.9};

const AI_INFO = {
  midjourney: {name:'Midjourney v6',   hint:'/imagineコマンドに貼り付け'},
  dalle:      {name:'DALL-E 3',         hint:'ChatGPT Plus または OpenAI API'},
  sd:         {name:'Stable Diffusion', hint:'ComfyUI / A1111 のPromptに貼り付け'},
  firefly:    {name:'Adobe Firefly',    hint:'Fireflyのテキストから画像で使用'},
  ideogram:   {name:'Ideogram',         hint:'ideogram.aiのテキストボックスに貼り付け'},
  other:      {name:'汎用プロンプト',   hint:'各種画像生成AIで使用可能'},
};

/* ============================================================
   STATE
   ============================================================ */
let leafMap   = null;
let wps       = [];     // {id, type, name, desc, tel, lat, lng, marker}
let vps       = [];     // {id, segAfter, lat, lng, marker}
let routeLine = null;
let hitOverlay= null;
let mode      = 'wp';
let editId    = null;
let idW = 0, idV = 0;
let lastOp    = null;
let lineDragging = false;
let dragSrcId    = null;
let courseInfo   = {name:'', area:'', start:'', goal:'', desc:''};
let _result      = null;

/* ============================================================
   SCREEN MANAGEMENT
   ============================================================ */
async function goToMap() {
  const name  = document.getElementById('s1Name').value.trim();
  const area  = document.getElementById('s1Area').value.trim();
  if (!name || !area) { alert('コース名とエリアを入力してください。'); return; }

  courseInfo.name  = name;
  courseInfo.area  = area;
  courseInfo.start = document.getElementById('s1Start').value.trim();
  courseInfo.goal  = document.getElementById('s1Goal').value.trim();

  const btn = document.getElementById('s1Btn');
  btn.disabled = true;
  btn.textContent = '⏳ マップを読み込み中...';

  document.getElementById('s1').style.display = 'none';
  document.getElementById('s2').style.display = 'flex';
  document.getElementById('cnDisp').textContent = name;

  // Init map AFTER screen 2 is visible
  setTimeout(async () => {
    if (!leafMap) initMap();
    else leafMap.invalidateSize();

    const coords = await geocode(area);
    if (coords) {
      leafMap.setView([coords.lat, coords.lng], 15);
    }

    btn.disabled = false;
    btn.textContent = 'コース設定画面へ →';
  }, 60);
}

function backToSetup() {
  if (!confirm('設定画面に戻りますか？（コース設定は保持されます）')) return;
  document.getElementById('s2').style.display = 'none';
  document.getElementById('s1').style.display = 'flex';
}

async function geocode(address) {
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1&accept-language=ja`;
    const res  = await fetch(url);
    const data = await res.json();
    if (data && data.length > 0) {
      return {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon)};
    }
  } catch (_) {}
  return null; // caller keeps default center
}

/* ============================================================
   MAP INIT
   ============================================================ */
function initMap() {
  leafMap = L.map('map', {center:[35.165, 134.542], zoom:14});

  const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap contributors', maxZoom:19
  }).addTo(leafMap);

  tiles.on('tileload', () => {
    const el = document.getElementById('mapMsg');
    if (el) el.style.display = 'none';
  });

  leafMap.on('click', onMapClick);

  // Build modal <select> on first init
  const sel = document.getElementById('mType');
  if (sel.options.length === 0) {
    WT.forEach(t => {
      const o = document.createElement('option');
      o.value = t.v; o.textContent = t.l;
      sel.appendChild(o);
    });
  }

  // Restore API key
  const k = localStorage.getItem('fp_key');
  if (k) document.getElementById('iKey').value = k;
}

/* ============================================================
   MAP CLICK
   ============================================================ */
function onMapClick(e) {
  if (lineDragging) return;
  if (mode === 'wp')  addWp(e.latlng.lat, e.latlng.lng);
  if (mode === 'via') addVp(e.latlng.lat, e.latlng.lng);
}

/* ============================================================
   WAYPOINTS
   ============================================================ */
function addWp(lat, lng) {
  idW++;
  const wp = {id:idW, type:'course', name:'', desc:'', tel:'', lat, lng, marker:null};
  wps.push(wp);
  wp.marker = buildWpMarker(wp);
  lastOp = {kind:'wp', id:idW};
  redrawStraight();
  redrawList();
  refreshIcons();
}

function buildWpMarker(wp) {
  const m = L.marker([wp.lat, wp.lng], {
    draggable: true,
    icon: wpIcon(wp),
    zIndexOffset: 1000
  }).addTo(leafMap);

  m.on('drag', () => {
    wp.lat = m.getLatLng().lat;
    wp.lng = m.getLatLng().lng;
    redrawStraight();
  });
  m.on('dragend', () => {
    wp.lat = m.getLatLng().lat;
    wp.lng = m.getLatLng().lng;
    redrawStraight();
  });
  m.on('click', e => {
    L.DomEvent.stopPropagation(e);
    openModal(wp.id);
  });

  // Tooltip (name popup) - only if has name
  if (wp.name && wp.name.trim()) {
    m.bindTooltip(wp.name, {permanent:true, direction:'top', offset:[0,-18], className:'wp-tt'});
  }

  return m;
}

function updateWpTooltip(wp) {
  if (!wp.marker) return;
  wp.marker.unbindTooltip();
  if (wp.name && wp.name.trim()) {
    wp.marker.bindTooltip(wp.name, {permanent:true, direction:'top', offset:[0,-18], className:'wp-tt'});
  }
}

function wpIcon(wp) {
  const t   = WT.find(x => x.v === wp.type) || WT[0];
  const sym = wp.type === 'course' ? (courseNum(wp) || '?') : (SYM[wp.type] || '●');
  return L.divIcon({
    className: '',
    html: `<div style="width:30px;height:30px;border-radius:50%;background:${t.c};color:#fff;
      display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;
      border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer">${sym}</div>`,
    iconSize:[30,30], iconAnchor:[15,15]
  });
}

function courseNum(wp) {
  const list = wps.filter(w => w.type === 'course');
  const i    = list.findIndex(w => w.id === wp.id);
  return i >= 0 ? i + 1 : null;
}

function refreshIcons() {
  wps.forEach(wp => {
    if (wp.marker) wp.marker.setIcon(wpIcon(wp));
  });
}

function deleteWp(id) {
  vps.filter(v => v.segAfter === id).forEach(v => {
    if (v.marker) leafMap.removeLayer(v.marker);
  });
  vps = vps.filter(v => v.segAfter !== id);

  const wp = wps.find(w => w.id === id);
  if (wp && wp.marker) leafMap.removeLayer(wp.marker);
  wps = wps.filter(w => w.id !== id);

  redrawStraight();
  refreshIcons();
  redrawList();
}

/* ============================================================
   VIA POINTS  (route shaping — traces any path)
   ============================================================ */
function addVp(lat, lng) {
  if (wps.length < 2) {
    alert('ウェイポイントを2点以上追加してから経路調整点を追加してください。\n\n【農道・細道のトレース方法】\n経路調整点追加モードで地図上の道に沿ってクリックすることで、どんな細い道もトレースできます。');
    return;
  }
  idV++;
  const vp = {id:'v'+idV, segAfter: nearestSegWpId(lat, lng), lat, lng, marker:null};
  vps.push(vp);
  vp.marker = buildVpMarker(vp);
  lastOp = {kind:'vp', id:vp.id};
  redrawStraight();
}

function buildVpMarker(vp) {
  const m = L.marker([vp.lat, vp.lng], {
    draggable: true,
    icon: viaIcon(),
    zIndexOffset: 500
  }).addTo(leafMap);

  m.on('drag', () => {
    vp.lat = m.getLatLng().lat;
    vp.lng = m.getLatLng().lng;
    redrawStraight();
  });
  m.on('dragend', () => {
    vp.lat = m.getLatLng().lat;
    vp.lng = m.getLatLng().lng;
    redrawStraight();
  });
  m.on('contextmenu', () => {
    leafMap.removeLayer(m);
    vps = vps.filter(v => v.id !== vp.id);
    redrawStraight();
  });

  return m;
}

function viaIcon() {
  return L.divIcon({
    className: '',
    html: `<div title="ドラッグで移動 / 右クリックで削除"
      style="width:13px;height:13px;border-radius:50%;background:#444;
      border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55);cursor:grab"></div>`,
    iconSize:[13,13], iconAnchor:[6.5,6.5]
  });
}

/* ============================================================
   LINE DRAG  — drag the route line to add via points
   ============================================================ */
function onHitDown(e) {
  L.DomEvent.stopPropagation(e);
  L.DomEvent.preventDefault(e);
  if (wps.length < 2) return;

  lineDragging = true;
  leafMap.dragging.disable();

  idV++;
  const vp = {id:'v'+idV, segAfter: nearestSegWpId(e.latlng.lat, e.latlng.lng), lat:e.latlng.lat, lng:e.latlng.lng, marker:null};
  vps.push(vp);
  lastOp = {kind:'vp', id:vp.id};

  // Temporary non-interactive marker
  const tmp = L.marker([vp.lat, vp.lng], {icon:viaIcon(), zIndexOffset:2000, interactive:false}).addTo(leafMap);
  vp.marker = tmp;
  redrawStraight();

  function onMove(ev) {
    vp.lat = ev.latlng.lat;
    vp.lng = ev.latlng.lng;
    tmp.setLatLng([vp.lat, vp.lng]);
    redrawStraight();
  }

  function onUp() {
    leafMap.off('mousemove', onMove);
    leafMap.off('mouseup',   onUp);
    leafMap.removeLayer(tmp);
    vp.marker = buildVpMarker(vp);  // replace with proper draggable marker
    lineDragging = false;
    leafMap.dragging.enable();
    redrawStraight();
  }

  leafMap.on('mousemove', onMove);
  leafMap.on('mouseup',   onUp);
}

// Safety: reset lineDragging if mouse released outside the map
window.addEventListener('mouseup', () => {
  if (lineDragging && leafMap) {
    lineDragging = false;
    leafMap.dragging.enable();
  }
});

/* ============================================================
   GEOMETRY HELPERS
   ============================================================ */
function nearestSegWpId(lat, lng) {
  if (wps.length < 2) return wps.length > 0 ? wps[0].id : null;
  let bestId = wps[0].id, minD = Infinity;
  for (let i = 0; i < wps.length - 1; i++) {
    const d = ptSegDist([lat,lng],[wps[i].lat,wps[i].lng],[wps[i+1].lat,wps[i+1].lng]);
    if (d < minD) { minD = d; bestId = wps[i].id; }
  }
  return bestId;
}

function ptSegDist(p, a, b) {
  const dx=b[0]-a[0], dy=b[1]-a[1];
  if (Math.abs(dx)<1e-12 && Math.abs(dy)<1e-12) return Math.hypot(p[0]-a[0],p[1]-a[1]);
  const t = Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy)));
  return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy));
}

function segVpsOf(wpId, wpA, wpB) {
  const dx=wpB.lat-wpA.lat, dy=wpB.lng-wpA.lng, len2=dx*dx+dy*dy;
  return vps
    .filter(v => v.segAfter === wpId)
    .map(v => {
      const t = len2>0 ? ((v.lat-wpA.lat)*dx+(v.lng-wpA.lng)*dy)/len2 : 0;
      return {vp:v,t};
    })
    .sort((a,b) => a.t-b.t)
    .map(x => x.vp);
}

function haversine(lat1,lng1,lat2,lng2) {
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(lat2-lat1), dLng=toR(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ============================================================
   POLYLINE
   ============================================================ */
function removeLines() {
  if (routeLine)  { leafMap.removeLayer(routeLine);  routeLine  = null; }
  if (hitOverlay) { leafMap.removeLayer(hitOverlay); hitOverlay = null; }
}

function buildStraightCoords() {
  const coords = [];
  for (let i = 0; i < wps.length; i++) {
    coords.push([wps[i].lat, wps[i].lng]);
    if (i+1 < wps.length) {
      segVpsOf(wps[i].id, wps[i], wps[i+1]).forEach(vp => coords.push([vp.lat, vp.lng]));
    }
  }
  return coords;
}

function drawLines(coords) {
  if (!coords || coords.length < 2) return;
  routeLine  = L.polyline(coords, LINE_STYLE).addTo(leafMap);
  hitOverlay = L.polyline(coords, {weight:22, opacity:0, color:'#000', interactive:true}).addTo(leafMap);
  hitOverlay.on('mousedown', onHitDown);
  const el = hitOverlay.getElement();
  if (el) el.style.cursor = 'grab';
}

function redrawStraight() {
  removeLines();
  if (wps.length >= 2) drawLines(buildStraightCoords());
  updateDistance();
}

/* ============================================================
   DISTANCE (auto-calculate)
   ============================================================ */
function updateDistance() {
  const coords = buildStraightCoords();
  let total = 0;
  for (let i = 0; i < coords.length-1; i++) {
    total += haversine(coords[i][0],coords[i][1],coords[i+1][0],coords[i+1][1]);
  }
  const el = document.getElementById('distDisp');
  if (el) el.textContent = coords.length >= 2 ? `総距離: ${(total/1000).toFixed(2)} km` : '総距離: — km';
}

/* ============================================================
   WAYPOINT LIST (draggable reorder)
   ============================================================ */
function redrawList() {
  const container = document.getElementById('wpList');
  const empty     = document.getElementById('wpEmpty');
  container.querySelectorAll('.wp-row').forEach(r => r.remove());

  if (wps.length === 0) {
    if (empty) empty.style.display = '';
    return;
  }
  if (empty) empty.style.display = 'none';

  let cn = 1;
  wps.forEach(wp => {
    const t   = WT.find(x => x.v === wp.type) || WT[0];
    const sym = wp.type === 'course' ? cn++ : (SYM[wp.type]||'●');
    const lbl = wp.name || `（${t.l}）`;

    const row = document.createElement('div');
    row.className = 'wp-row';
    row.draggable = true;
    row.dataset.id = wp.id;
    row.innerHTML = `
      <div class="wp-dot" style="background:${t.c}">${sym}</div>
      <div class="wp-name">${lbl}</div>
      <div class="wp-edit-btn">✏</div>`;

    // Click to fly and edit
    row.addEventListener('click', () => flyEdit(wp.id));
    row.querySelector('.wp-edit-btn').addEventListener('click', e => {
      e.stopPropagation(); openModal(wp.id);
    });

    // HTML5 drag-and-drop reorder
    row.addEventListener('dragstart', e => {
      dragSrcId = wp.id;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => row.classList.add('dragging'), 0);
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      container.querySelectorAll('.wp-row').forEach(r => r.classList.remove('drag-over'));
      dragSrcId = null;
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      container.querySelectorAll('.wp-row').forEach(r => r.classList.remove('drag-over'));
      if (dragSrcId !== wp.id) row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('drag-over');
      if (!dragSrcId || dragSrcId === wp.id) return;

      const srcIdx = wps.findIndex(w => w.id === dragSrcId);
      const tgtIdx = wps.findIndex(w => w.id === wp.id);
      if (srcIdx < 0 || tgtIdx < 0) return;

      const [moved] = wps.splice(srcIdx, 1);
      const newTgt  = wps.findIndex(w => w.id === wp.id);
      wps.splice(newTgt, 0, moved);

      redrawStraight();
      redrawList();
      refreshIcons();
    });

    container.appendChild(row);
  });
}

function flyEdit(id) {
  const wp = wps.find(w => w.id === id);
  if (!wp) return;
  leafMap.flyTo([wp.lat, wp.lng], Math.max(leafMap.getZoom(), 15), {duration:.5});
  setTimeout(() => openModal(id), 350);
}

  mode = m;
  document.getElementById('btnWp').classList.toggle('on',  m==='wp');
  document.getElementById('btnVia').classList.toggle('on', m==='via');
  document.getElementById('tbar-status').textContent = m === 'wp'

    : '地図クリックで経路調整点を追加（農道・細道に沿ってクリックで正確にトレース）/ 右クリックで削除';
}

function undoLast() {
  if (!lastOp) return;
  const op  = lastOp; lastOp = null;
  if (op.kind === 'wp') {
    deleteWp(op.id);
  } else {
    const vp = vps.find(v => v.id === op.id);
    if (vp) {
      if (vp.marker) leafMap.removeLayer(vp.marker);
      vps = vps.filter(v => v.id !== op.id);
      redrawStraight();
    }
  }
}

function clearAll() {
  if (wps.length === 0 && vps.length === 0) return;
  if (!confirm('すべてのウェイポイントと経路調整点を消去しますか？')) return;
  wps.forEach(wp => { if (wp.marker) leafMap.removeLayer(wp.marker); });
  vps.forEach(vp => { if (vp.marker) leafMap.removeLayer(vp.marker); });
  wps = []; vps = []; lastOp = null;
  removeLines();
  redrawList();
  updateDistance();
}

async function doGenerate() {
  const aiKey = document.getElementById('aiSel').value;
  try {
    const apiKey = document.getElementById('iKey').value.trim();
    const headers = {
      'Content-Type':     'application/json',
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    };
    if (apiKey) headers['x-api-key'] = apiKey;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers,
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:4096,
        messages:[{role:'user', content:buildApiPrompt(aiKey)}]
      })
    });

    if (!res.ok) {
      const errData = await res.json().catch(()=>({error:{message:`HTTP ${res.status}`}}));
      throw new Error(errData.error?.message || `HTTP ${res.status}`);
    }

    const data    = await res.json();
    const text    = data.content.filter(c=>c.type==='text').map(c=>c.text).join('');
    const cleaned = text.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
    const match   = cleaned.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('JSONの抽出に失敗しました。再度お試しください。');

    _result = JSON.parse(match[0]);
    renderResult(_result, aiKey);

  } catch(e) {
    let msg = e.message;
    if (msg.includes('Load failed') || msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
      msg = 'ネットワークエラー: APIへの接続に失敗しました。\n① APIキーが正しく入力されているか確認\n② インターネット接続を確認\n③ GitHub Pagesで開いていることを確認（ローカルファイルでは動作しません）';
    }
    document.getElementById('resContent').innerHTML =
      `<div style="color:#B71C1C;font-size:12px;padding:10px;background:#FFEBEE;border-radius:4px;white-space:pre-wrap">❌ ${msg}</div>`;
  }
}

  if (r.prompt) {

    </div>`;
  }

  // Negative prompt (SD only)

    html += `<div class="res-blk">

  }

  // Map header text (Japanese)

    html += `<div class="res-blk">

        <div class="res-lbl">📄 マップヘッダー文章（日本語）</div>
        <button class="cp-btn" onclick="cpKey('map_text')">📋 コピー</button>
      </div>
      <div class="res-hint">地図のヘッダーに掲載するテキスト</div>
      <div class="res-txt" style="font-family:inherit;font-size:12px;line-height:1.8">${safe}</div>
    </div>`;
  }

  // Tips
  if (Array.isArray(r.tips) && r.tips.length) {
    html += `<div class="res-blk">
      <div class="res-lbl" style="margin-bottom:6px">💡 制作アドバイス</div>

        ${r.tips.map(t=>`<li>${t}</li>`).join('')}
      </ul>
    </div>`;
  }

  document.getElementById('resContent').innerHTML = html || '<div style="color:#999;font-size:12px">結果が空でした。再度お試しください。</div>';
}
