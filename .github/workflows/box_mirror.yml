# 「みんなの箱」に出されたコースを、自動で GitHub（library/）へ写す。
# 箱は登録も合言葉もいらない代わりに誰でも上書きできるので、写した時点で永久保存になる。
# 写したぶんは箱から外れ、アプリは以降 library/ 側を読む。
# ※ リポジトリを60日以上さわらないと、GitHub は定期実行を自動で止める（その時は「Run workflow」で再開）。
name: みんなの箱をGitHubに写す

on:
  schedule:
    - cron: '*/10 * * * *'   # 10分ごと（GitHub の都合で数分ずれることがある）
  workflow_dispatch:         # 手動でも実行できる

permissions:
  contents: write

concurrency:
  group: box-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: 箱 → library/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 箱から写す
        run: python3 tools/box_mirror.py

      - name: 変わっていたらコミットする
        run: |
          if [ -z "$(git status --porcelain library)" ]; then
            echo "写すものはありませんでした"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library
          git commit -m "みんなの箱から写しました [skip ci]"
          git pull --rebase --autostash
          git push
